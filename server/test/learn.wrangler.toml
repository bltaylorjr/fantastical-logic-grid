# Test-only config: runs the learning routes on their own with wrangler dev.
# The real Worker config is server/wrangler.toml (with player accounts), which
# needs the same bindings and vars as below.
name = "flg-learn-test"
main = "learn-dev.js"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
# Sites and apps allowed to call the service (comma separated).
ALLOWED_ORIGINS = "https://thelogicgrid.com,https://www.thelogicgrid.com,https://bltaylorjr.github.io,tauri://localhost,http://tauri.localhost,https://tauri.localhost,https://appassets.androidplatform.net,app://localhost,capacitor://localhost,http://localhost:8080"
# Voice clips made per day across all players; protects the Gemini free quota.
# Clips already made are served from the cache and do not count.
DAILY_TTS_CAP = "300"
TTS_MODEL = "gemini-3.8-flash-tts"

[[d1_databases]]
binding = "DB"
database_name = "flg-cloud"
database_id = "local-test"
migrations_dir = "../migrations"

# Per-player limits, keyed by a one-way hash of the connection address that is
# never stored.
[[ratelimits]]
name = "LIMIT_PLAYS"
namespace_id = "41001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIMIT_PARTS"
namespace_id = "41002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LIMIT_TTS"
namespace_id = "41003"
simple = { limit = 30, period = 60 }
