# The game's Cloudflare Worker: player accounts sync (src/sync.js), screen
# names, races and the scoreboard (src/compete.js), and the
# shared learning + voice service (src/learn.js). Setup steps: README.md.
name = "flg-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# The D1 database "flg" (created in the Cloudflare dashboard).
[[d1_databases]]
binding = "DB"
database_name = "flg"
database_id = "7285197a-aadd-4e07-ba53-0af8268cf794"
migrations_dir = "migrations"

[vars]
# The Firebase project that owns player sign-in. Its ID tokens are checked here.
FIREBASE_PROJECT_ID = "fantastical-logic-grid"
# Pages and apps allowed to call this Worker: the website, GitHub Pages, the
# Windows/macOS desktop app (Tauri), the Android app and the iPhone app.
ALLOWED_ORIGINS = "https://thelogicgrid.com,https://www.thelogicgrid.com,https://bltaylorjr.github.io,http://tauri.localhost,https://tauri.localhost,tauri://localhost,https://appassets.androidplatform.net,app://localhost"
DAILY_TTS_CAP = "300"
TTS_MODEL = "gemini-3.8-flash-tts"
# Secrets (never in this file): GEMINI_API_KEY and ADMIN_TOKEN, set with
# `npx wrangler secret put <NAME>`.

# The daily cleanup of old data (src/upkeep.js), at 03:17 UTC. Free plans
# allow up to 5 cron triggers.
[triggers]
crons = ["17 3 * * *"]

# Per-client request limits.
[[ratelimits]]
name = "LIMIT_SYNC"
namespace_id = "41010"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LIMIT_AUTHLESS"
namespace_id = "41011"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMIT_COMPETE"
namespace_id = "41020"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_PLAYS"
namespace_id = "41001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIMIT_PARTS"
namespace_id = "41002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LIMIT_TTS"
namespace_id = "41003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_ERRORS"
namespace_id = "41030"
simple = { limit = 10, period = 60 }
