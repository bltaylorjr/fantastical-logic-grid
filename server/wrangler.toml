# The game's Cloudflare Worker: player accounts sync (src/sync.js), screen
# names, races and the scoreboard (src/compete.js), and the
# shared learning + voice service (src/learn.js). Setup steps: README.md.
name = "flg-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# The D1 database "flg" (created in the Cloudflare dashboard).
[[d1_databases]]
binding = "DB"
database_name = "flg"
database_id = "7285197a-aadd-4e07-ba53-0af8268cf794"
migrations_dir = "migrations"

[vars]
# The Firebase project that owns player sign-in. Its ID tokens are checked here.
FIREBASE_PROJECT_ID = "the-fantastical-logic-grid"
# Pages and apps allowed to call this Worker: the website, GitHub Pages, the
# Windows/macOS desktop app (Tauri), the Android app and the iPhone app.
ALLOWED_ORIGINS = "https://thelogicgrid.com,https://www.thelogicgrid.com,https://bltaylorjr.github.io,http://tauri.localhost,https://tauri.localhost,tauri://localhost,https://appassets.androidplatform.net,app://localhost"
DAILY_TTS_CAP = "300"
# The sender of the weekly archive email: an address on a domain that has
# Cloudflare Email Routing switched on (ARCHIVE.md).
ARCHIVE_FROM = "backups@thelogicgrid.com"
TTS_MODEL = "gemini-3.8-flash-tts"
# The Search Console and Bing Webmaster property shown in the admin dashboard.
SEARCH_SITE_URL = "https://thelogicgrid.com/"
# The public website: the daily puzzle planner reads the coming days from it.
SITE_URL = "https://thelogicgrid.com"
# Secrets (never in this file): GEMINI_API_KEY, ADMIN_TOKEN and ARCHIVE_TO, set with
# `npx wrangler secret put <NAME>` or in the dashboard as type Secret. The admin
# dashboard also uses OWNER_EMAIL and FIREBASE_WEB_API_KEY, and optionally
# CF_API_TOKEN and CF_ACCOUNT_ID, GSC_SERVICE_ACCOUNT and BING_WEBMASTER_KEY
# (see ../admin/README.md).

# Cloudflare Workers AI paints the game's AI pictures (src/pictures.js) on its
# free daily allowance. No key is needed, and on the free plan it never bills.
[ai]
binding = "AI"

# The admin dashboard's files (../admin), served by src/admin.js at /admin/.
# The Worker runs first so it can add security headers and keep every other
# path for the API.
[assets]
directory = "../admin"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# The daily cleanup of old data (src/upkeep.js), at 03:17 UTC, the weekly
# archive email (src/archive.js), Mondays at 04:47 UTC, and the daily fetch of
# Google and Bing search numbers (src/search.js), at 06:41 UTC. Free plans
# allow up to 5 cron triggers.
[triggers]
crons = ["17 3 * * *", "47 4 * * 1", "41 6 * * *"]

# The weekly archive email is sent from Gmail by a GitHub Action, because the
# domain's DNS is not on Cloudflare (ARCHIVE.md). Only if it moves there and
# Email Routing is switched on, uncomment this so the Worker sends it itself:
# [[send_email]]
# name = "ARCHIVE_EMAIL"

# Per-client request limits.
[[ratelimits]]
name = "LIMIT_SYNC"
namespace_id = "41010"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LIMIT_AUTHLESS"
namespace_id = "41011"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMIT_COMPETE"
namespace_id = "41020"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_PLAYS"
namespace_id = "41001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIMIT_PARTS"
namespace_id = "41002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LIMIT_TTS"
namespace_id = "41003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_FEEDBACK"
namespace_id = "41031"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LIMIT_PICTURES"
namespace_id = "41004"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LIMIT_TRANSLATE"
namespace_id = "41050"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LIMIT_ERRORS"
namespace_id = "41030"
simple = { limit = 10, period = 60 }

# The admin dashboard: every /admin request per connection, and every signed-in
# admin's requests.
[[ratelimits]]
name = "LIMIT_ADMIN_IP"
namespace_id = "41041"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMIT_ADMIN"
namespace_id = "41040"
simple = { limit = 60, period = 60 }
