# Temporary, one-time: emails the October 27 market report PDFs without putting
# readable copies in this public repository. The runner makes a one-time key pair,
# pushes only the public key, waits for the PDFs encrypted to it, then emails them.
# Removed from the branch right after use.
name: Temporary report email
on:
  push:
    branches: [claude/project-thread-8jtoyd]
    paths: ['.github/workflows/tmp-send-reports.yml']
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-8jtoyd
      - name: Publish a one-time public key
        run: |
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/k.pem"
          mkdir -p tmp-mail
          openssl pkey -in "$RUNNER_TEMP/k.pem" -pubout -out tmp-mail/pub.pem
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add tmp-mail/pub.pem; git commit -m "Temporary public key for the report email"; git push
      - name: Wait for the encrypted reports
        run: |
          for i in $(seq 1 120); do
            git fetch -q origin claude/project-thread-8jtoyd
            if git cat-file -e origin/claude/project-thread-8jtoyd:tmp-mail/payload.enc 2>/dev/null; then
              git checkout -q origin/claude/project-thread-8jtoyd -- tmp-mail; exit 0; fi
            sleep 10
          done
          echo "No payload arrived"; exit 1
      - name: Decrypt and email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          umask 077; W="$RUNNER_TEMP/w"; mkdir -p "$W"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/k.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in tmp-mail/key.enc -out "$W/key.bin"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass "file:$W/key.bin" -in tmp-mail/payload.enc -out "$W/p.tgz"
          tar -xzf "$W/p.tgz" -C "$W"
          python3 -I - "$W" <<'PY'
          import os, smtplib, ssl, sys, glob
          from email.message import EmailMessage
          w = sys.argv[1]
          msg = EmailMessage()
          msg['From'] = os.environ['GMAIL_USER']; msg['To'] = 'btay74@outlook.com'
          msg['Subject'] = 'The Fantastical Logic Grid: market analysis, new puzzle engines plan, and money reports (Oct 27, 2026)'
          msg.set_content(open(os.path.join(w, 'body.txt')).read())
          for f in sorted(glob.glob(os.path.join(w, '*.pdf'))):
              msg.add_attachment(open(f, 'rb').read(), maintype='application', subtype='pdf', filename=os.path.basename(f))
          with smtplib.SMTP_SSL('smtp.gmail.com', 465, context=ssl.create_default_context(), timeout=120) as s:
              s.login(os.environ['GMAIL_USER'], os.environ['GMAIL_APP_PASSWORD']); s.send_message(msg)
          print('sent', len(msg.get_payload()) - 1, 'attachments')
          PY
          rm -rf "$W" "$RUNNER_TEMP/k.pem"
      - name: Remove the temporary files
        if: always()
        run: |
          git fetch -q origin claude/project-thread-8jtoyd && git checkout -q -B tmp origin/claude/project-thread-8jtoyd
          git rm -rq tmp-mail || true
          git commit -qm "Remove temporary report email files" && git push origin HEAD:claude/project-thread-8jtoyd || true
