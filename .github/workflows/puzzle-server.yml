# Deploys the private puzzle server (docs/PUZZLE-SERVER.md) to the Oracle
# build server whenever the engine or the puzzle server changes on main.
# It runs on one of the Oracle runners, which share the folder /flg-puzzles
# with the puzzle server container: each release is copied into its own folder,
# then the file "current" is switched to it. The puzzle server notices within
# 15 seconds, finishes the puzzles it is making and restarts on the new release.
# Safe updates, no AI involved: before the switch, the copied release must pass
# the engine canary (engine/health.js --quick: every game builds, has one
# answer, survives JSON and gives hints). After the switch, if the server
# starts on the new release but does not become healthy within 4 minutes,
# "current" is switched back to the release that was live before, and the run
# fails so the Actions tab shows it.
# Off until the repository variable FLG_PUZZLE_DEPLOY is 1 (and FLG_RUNNER is set).
name: Deploy puzzle server
on:
  push:
    branches: [main]
    paths:
      - 'engine/src/**'
      - 'engine/doctor.js'
      - 'engine/health.js'
      - 'puzzle-server/**'
      - '.github/workflows/puzzle-server.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: puzzle-server
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.FLG_PUZZLE_DEPLOY == '1' && vars.FLG_RUNNER != ''
    runs-on: [self-hosted, flg]
    timeout-minutes: 20
    steps:
      - if: runner.environment == 'self-hosted'
        name: Start from an empty folder (our build server keeps the last job's files)
        run: sudo find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            engine
            puzzle-server
          sparse-checkout-cone-mode: false
      - name: Test the puzzle server
        run: node puzzle-server/test/server.test.mjs
      - name: Engine doctor tests
        run: node engine/test/doctor-tests.js
      - name: Copy the release to the puzzle server
        run: |
          set -euo pipefail
          test -d /flg-puzzles/releases || { echo "::error::/flg-puzzles is missing. Run the updated setup script on the Oracle server (docs/PUZZLE-SERVER.md)."; exit 1; }
          rel="${GITHUB_SHA::12}"
          dest="/flg-puzzles/releases/$rel"
          rm -rf "$dest.tmp" && mkdir -p "$dest.tmp/engine"
          cp -r engine/src "$dest.tmp/engine/src"
          cp engine/package.json engine/doctor.js engine/health.js "$dest.tmp/engine/"
          mkdir -p "$dest.tmp/puzzle-server"
          cp puzzle-server/package.json puzzle-server/*.mjs "$dest.tmp/puzzle-server/"
          # Canary: the copy that will go live must pass before anything switches.
          if ! node "$dest.tmp/engine/health.js" --quick --engine-dir "$dest.tmp/engine/src"; then
            rm -rf "$dest.tmp"
            echo "::error::Release $rel failed the engine canary; the live release was not changed."
            exit 1
          fi
          rm -rf "$dest" && mv "$dest.tmp" "$dest"
          prev=$(cat /flg-puzzles/current 2>/dev/null || true)
          if [ -n "$prev" ] && [ "$prev" != "$rel" ]; then echo "$prev" > /flg-puzzles/previous; fi
          echo "$rel" > /flg-puzzles/current.tmp && mv /flg-puzzles/current.tmp /flg-puzzles/current
          # Keep the newest three releases, and always the one to roll back to.
          keep_prev=$(cat /flg-puzzles/previous 2>/dev/null || true)
          ls -1dt /flg-puzzles/releases/*/ | tail -n +4 | while read -r d; do [ "$(basename "$d")" = "$keep_prev" ] || rm -rf "$d"; done
          echo "Release $rel is live."
      - name: Check the game can reach it
        if: vars.FLG_CLOUD_URL != ''
        env:
          CLOUD: ${{ vars.FLG_CLOUD_URL }}
        run: |
          rel="${GITHUB_SHA::12}"
          seen=0
          for i in $(seq 1 24); do
            h=$(curl -fsS "$CLOUD/v1/puzzles/health" || true)
            echo "$h"
            # The puzzle server answered (on any release), so the tunnel works.
            case "$h" in *'"release":"'*) seen=1;; esac
            case "$h" in *"\"release\":\"$rel\""*'"ok":true'*|*'"ok":true'*"\"release\":\"$rel\""*) echo "The Worker reaches release $rel."; exit 0;; esac
            sleep 10
          done
          prev=$(cat /flg-puzzles/previous 2>/dev/null || true)
          if [ "$seen" = 1 ] && [ -n "$prev" ] && [ -f "/flg-puzzles/releases/$prev/puzzle-server/server.mjs" ]; then
            # The server is reachable but the new release never became healthy
            # (it fails its start-up check or keeps crashing): put the old one back.
            echo "$prev" > /flg-puzzles/current.tmp && mv /flg-puzzles/current.tmp /flg-puzzles/current
            echo "::error::Release $rel did not become healthy within 4 minutes. Rolled back to $prev."
            exit 1
          fi
          echo "::warning::The Worker could not reach release $rel yet. Check the tunnel and the PUZZLE_KEY secret (docs/PUZZLE-SERVER.md)."
