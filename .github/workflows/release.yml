# Builds the Windows desktop app and publishes a GitHub Release with a signed
# update package and latest.json, which installed copies check for updates.
# It runs by itself when a version bump reaches main (package.json changes to a
# version that has no release yet), or from the Actions tab (Run workflow), or
# by pushing a tag like v1.2.0.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the updater signing key).
name: Release desktop app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: [package.json]
permissions:
  contents: write
concurrency:
  group: release
jobs:
  new-version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: new-version
    if: needs.new-version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
      - run: npm run build
        env:
          FLG_FIREBASE_API_KEY: ${{ vars.FLG_FIREBASE_API_KEY }}
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: desktop
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: The Fantastical Logic Grid v__VERSION__
          releaseBody: Download the setup .exe below to install. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
