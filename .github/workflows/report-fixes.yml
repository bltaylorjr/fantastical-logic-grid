# Report fixes (server/PUZZLE-REPORTS.md, "Code fixes"): when a pull request
# merges into main and its body says "Fixes reports: PZ-..., WS-..." (or
# "Fixes error: ...") with a "Player note:", the reports are marked addressed
# with that note and the version it shipped in, and the players who asked are
# emailed. Puzzle reports that needed a fix in the puzzle maker go back to the
# puzzle doctor for the repaired puzzle. Run it by hand to close reports
# without a pull request. The repository is public: prints counts and ids only.
name: Report fixes
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      trackings:
        description: Tracking ids, comma separated (PZ-... or WS-...)
        type: string
        default: ''
      note:
        description: What was done, in everyday words (players see this)
        type: string
        required: true
      error:
        description: Optional app error fixed, as "message | file"
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: report-fixes
jobs:
  close:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON(vars.FLG_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            package.json
            scripts/report-fixes.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Close the reports this change fixed
        env:
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL || 'https://flg-api.btay74.workers.dev' }}
          FLG_ADMIN_TOKEN: ${{ secrets.FLG_ADMIN_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          TRACKINGS: ${{ inputs.trackings }}
          NOTE: ${{ inputs.note }}
          ERROR: ${{ inputs.error }}
        run: node scripts/report-fixes.mjs
