# Records the talking-face example clips (video/examples): real faces from the
# game's server, the game's own talking face, Kokoro voices. The clips are
# kept as a download on the run (Actions > this run > Artifacts).
# Free: GitHub's hosted runners, Kokoro (local), faces painted once and kept.
name: Talking face examples
on:
  workflow_dispatch:
  push:
    paths:
      - 'video/examples/**'
      - '.github/workflows/talking-face-examples.yml'
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: video/requirements.txt
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          pip install -r video/requirements.txt
      - uses: actions/cache@v4
        with:
          path: video/.kokoro
          key: kokoro-v1.0
      - run: npm run build
      - name: Voices
        run: python video/examples/voices.py
      - name: Faces and video
        env:
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL || 'https://flg-api.btay74.workers.dev' }}
        run: node video/examples/render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talking-face-examples
          path: |
            video/examples/out/*.mp4
            video/examples/out/*.jpg
          retention-days: 30
