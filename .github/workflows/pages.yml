# Publishes the web version (dist/site) on every push to main, which includes
# every version bump that ships a release, and again each day just after
# midnight UTC so the daily puzzle page and the sitemap stay fresh. After each
# publish it tells IndexNow search engines (Bing, Yandex, Seznam, Naver...)
# which pages changed. Search setup: SEO.md.
# GitHub Pages: one-time setup is Settings > Pages > Source: GitHub Actions.
# Other web hosts are opt-in: each one deploys only when its repository secrets
# are set (Settings > Secrets and variables > Actions). See hosting/DEPLOY.md.
name: Publish web version
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 0 * * *'   # daily puzzle page
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          FLG_FIREBASE_API_KEY: ${{ vars.FLG_FIREBASE_API_KEY }}
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL }}
          FLG_SITE_URL: ${{ vars.FLG_SITE_URL }}
          FLG_GOOGLE_SITE_VERIFICATION: ${{ vars.FLG_GOOGLE_SITE_VERIFICATION }}
          FLG_BING_SITE_VERIFICATION: ${{ vars.FLG_BING_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deploy
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: ${{ vars.FLG_SITE_URL || 'https://thelogicgrid.com' }}
      # Must match INDEXNOW_KEY in scripts/seo.mjs (the site serves it as <key>.txt).
      KEY: ${{ vars.FLG_INDEXNOW_KEY || 'fae88a004ad87116c0e93df007b2de7e' }}
    steps:
      - name: Tell IndexNow search engines which pages changed today
        run: |
          sleep 60   # let the new version reach the Pages CDN
          today=$(date -u +%F)
          sitemap=$(curl -fsSL --retry 3 "$SITE/sitemap.xml")
          urls=$(grep -o "<loc>[^<]*</loc><lastmod>$today<" <<<"$sitemap" | sed 's#<loc>##; s#</loc>.*##' | jq -R . | jq -sc .)
          if [ "$urls" = "[]" ]; then echo "No pages changed today."; exit 0; fi
          echo "Submitting: $urls"
          host=${SITE#*://}; host=${host%%/*}
          body=$(jq -nc --arg host "$host" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')
          code=$(curl -sS -o /dev/stderr -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow answered $code"
          # 200 and 202 mean accepted; 429 means too many submissions today (try again tomorrow).
          case "$code" in 200|202|429) ;; *) exit 1 ;; esac

  other-hosts:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT: ${{ secrets.CLOUDFLARE_PROJECT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PATH: ${{ secrets.SSH_PATH }}
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - name: Check which hosts are set up
        id: hosts
        run: |
          any=false
          for v in NETLIFY_AUTH_TOKEN CLOUDFLARE_API_TOKEN FTP_SERVER SSH_HOST DEPLOY_HOOK_URL; do
            [ -n "${!v}" ] && any=true
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"
          [ "$any" = true ] || echo "No other web hosts are set up; only GitHub Pages is updated."
      - if: steps.hosts.outputs.any == 'true'
        uses: actions/checkout@v7
      - if: steps.hosts.outputs.any == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.hosts.outputs.any == 'true'
        run: npm ci && npm run build
        env:
          FLG_FIREBASE_API_KEY: ${{ vars.FLG_FIREBASE_API_KEY }}
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL }}
          FLG_SITE_URL: ${{ vars.FLG_SITE_URL }}
          FLG_GOOGLE_SITE_VERIFICATION: ${{ vars.FLG_GOOGLE_SITE_VERIFICATION }}
          FLG_BING_SITE_VERIFICATION: ${{ vars.FLG_BING_SITE_VERIFICATION }}

      - name: Netlify
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli@27.10.2 deploy --prod --dir dist/site --site "$NETLIFY_SITE_ID" --message "${GITHUB_SHA::7}"

      - name: Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PROJECT != ''
        run: npx --yes wrangler@4.145.0 pages deploy dist/site --project-name "$CLOUDFLARE_PROJECT" --branch main --commit-dirty=true

      - name: FTP or FTPS server
        if: env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Uploads only changed files and removes files the new version no longer has.
          # FTP_SERVER may start with ftp:// or ftps://; plain hosts use FTPS when the server offers it.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate yes; set ftp:ssl-allow yes; mirror --reverse --delete --verbose --exclude-glob .git* dist/site '${FTP_DIR:-/}'; quit"

      - name: SSH server (rsync)
        if: env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' && env.SSH_PATH != ''
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -rlvz --delete -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" dist/site/ "$SSH_USER@$SSH_HOST:$SSH_PATH/"
          rm -f ~/.ssh/deploy_key

      - name: Deploy hook (Vercel, Render, Netlify build hooks, cPanel and others)
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"
