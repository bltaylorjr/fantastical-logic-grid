# Deploys Vox, the voice engine (vox-engine/), to the Oracle server whenever it
# changes on main (docs/VOX-SERVER.md). Like the puzzle server: it runs on one
# of the Oracle runners, which share /flg-puzzles with the server; each release
# is copied into /flg-puzzles/vox/releases/<sha>, checked, then "current" is
# switched to it. The flg-vox container notices within 15 seconds and restarts
# on the new release. If the Worker can reach Vox but the new release doesn't
# become healthy within 10 minutes (first-time installs take a while), the
# previous release is put back and the run fails.
# Off until the repository variable FLG_VOX_DEPLOY is 1 (and FLG_RUNNER is set).
name: Deploy Vox to the server
on:
  push:
    branches: [main]
    paths:
      - 'vox-engine/**'
      - '.github/workflows/vox-server.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vox-server
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.FLG_VOX_DEPLOY == '1' && vars.FLG_RUNNER != ''
    runs-on: [self-hosted, flg]
    timeout-minutes: 30
    steps:
      - if: runner.environment == 'self-hosted'
        name: Start from an empty folder (our build server keeps the last job's files)
        run: sudo find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
      - uses: actions/checkout@v7
        with:
          sparse-checkout: vox-engine
      - name: Check the engine's code
        run: python3 -m compileall -q vox-engine/vox && sh -n vox-engine/deploy/run.sh
      - name: Copy the release to the server
        run: |
          set -euo pipefail
          V=/flg-puzzles/vox
          test -d "$V/releases" || { echo "::error::$V is missing. Run the updated setup script on the Oracle server (docs/VOX-SERVER.md)."; exit 1; }
          rel="${GITHUB_SHA::12}"
          rm -rf "$V/releases/$rel.tmp" && mkdir -p "$V/releases/$rel.tmp"
          cp -r vox-engine "$V/releases/$rel.tmp/vox-engine"
          find "$V/releases/$rel.tmp" -name __pycache__ -prune -exec rm -rf {} +
          rm -rf "$V/releases/$rel" && mv "$V/releases/$rel.tmp" "$V/releases/$rel"
          prev=$(cat "$V/current" 2>/dev/null || true)
          if [ -n "$prev" ] && [ "$prev" != "$rel" ]; then echo "$prev" > "$V/previous"; fi
          echo "$rel" > "$V/current.tmp" && mv "$V/current.tmp" "$V/current"
          keep_prev=$(cat "$V/previous" 2>/dev/null || true)
          ls -1dt "$V"/releases/*/ | tail -n +4 | while read -r d; do [ "$(basename "$d")" = "$keep_prev" ] || rm -rf "$d"; done
          echo "Release $rel is live."
      - name: Check the admin app can reach it
        if: vars.FLG_CLOUD_URL != ''
        env:
          CLOUD: ${{ vars.FLG_CLOUD_URL }}
        run: |
          rel="${GITHUB_SHA::12}"
          V=/flg-puzzles/vox
          seen=0
          for i in $(seq 1 60); do
            h=$(curl -fsS "$CLOUD/admin/v1/vox-health" || true)
            echo "$h"
            case "$h" in *'"release":"'*) seen=1;; esac
            case "$h" in *"\"release\":\"$rel\""*) echo "The admin app reaches Vox release $rel."; exit 0;; esac
            sleep 10
          done
          prev=$(cat "$V/previous" 2>/dev/null || true)
          if [ "$seen" = 1 ] && [ -n "$prev" ] && [ -f "$V/releases/$prev/vox-engine/deploy/run.sh" ]; then
            echo "$prev" > "$V/current.tmp" && mv "$V/current.tmp" "$V/current"
            echo "::error::Vox release $rel did not become healthy within 10 minutes. Rolled back to $prev."
            exit 1
          fi
          echo "::warning::The admin app could not reach Vox release $rel yet. Check the VPC service flg-vox and the VOX_KEY secret (docs/VOX-SERVER.md)."
