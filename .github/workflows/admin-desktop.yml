# Builds the Windows admin app (desktop-admin/) and publishes it to the GitHub
# Release tagged admin-desktop, which the "Download for Windows" button in the
# admin dashboard and the installed app's updater both use. That release is never
# marked "latest", so the game's own releases and updates are not affected.
# On a pull request it only builds the installer (a check that it still builds).
# It publishes when a version bump of desktop-admin/src-tauri/tauri.conf.json
# reaches main and that version is not out yet, or from the Actions tab.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the same updater key as the game).
# Free: GitHub Actions minutes are free for public repos.
name: Admin app for Windows
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop-admin/**', '.github/workflows/admin-desktop.yml']
  push:
    branches: [main]
    paths: ['desktop-admin/**']
permissions:
  contents: write
concurrency:
  group: admin-desktop-${{ github.ref }}
env:
  TAG: admin-desktop
  SETUP: The-Fantastical-Logic-Grid-Admin-Setup.exe
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-admin/src-tauri -> target
      - run: npm ci
      - name: Is this version new?
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./desktop-admin/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          out=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output - 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)
          echo "Released: ${out:-none}. This build: $version."
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$out" = "$version" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"
          else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build the installer
        env:
          # Pull requests build without the key: the installer is made, just not
          # the signed update package (that only matters when publishing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.v.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          cd desktop-admin
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build
          fi
      - name: Publish to the admin-desktop release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          dir=desktop-admin/src-tauri/target/release/bundle/nsis
          exe=$(ls "$dir"/*_x64-setup.exe | head -1)
          cp "$exe" "$SETUP"
          sig=$(cat "$exe.sig")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$SETUP"
          node -e '
            const [version, signature, url] = process.argv.slice(1);
            const out = { version, notes: "", pub_date: new Date().toISOString(), platforms: { "windows-x86_64": { signature, url } } };
            require("fs").writeFileSync("latest.json", JSON.stringify(out, null, 2));
          ' "$VERSION" "$sig" "$url"
          notes="The Fantastical Logic Grid Admin for Windows, version $VERSION. Download $SETUP below and open it to install; installed copies update themselves. Windows may say \"Windows protected your PC\" because the app is not signed with a paid certificate: click More info, then Run anyway."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Admin app for Windows v$VERSION" --notes "$notes" --latest=false
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Admin app for Windows v$VERSION" --notes "$notes" --latest=false
          fi
          # The installer first, then latest.json, so the updater never points at a file that is not there yet.
          gh release upload "$TAG" "$SETUP" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          # Checksums so anyone can check the installer is the genuine one.
          sha256sum "$SETUP" > SHA256SUMS-admin.txt && cat SHA256SUMS-admin.txt
          gh release upload "$TAG" SHA256SUMS-admin.txt --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: admin-windows-installer
          path: desktop-admin/src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          retention-days: 14
