# Passwords drop box: Claude pushes a vault-drop/<time> branch holding only
# logins locked to the vault's public key (scripts/vault-drop.mjs --push).
# This sends them to the drop box, then deletes the branch. The files can
# only be opened by the owner's unlocked dashboard, so nothing readable is
# ever in the repo, the logs or this workflow.
name: Passwords drop box

on:
  push:
    branches: ['vault-drop/**']

permissions:
  contents: write

concurrency:
  group: vault-drop-${{ github.ref }}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Send the locked logins to the drop box
        env:
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL || 'https://flg-api.btay74.workers.dev' }}
          FLG_ADMIN_TOKEN: ${{ secrets.FLG_ADMIN_TOKEN }}
        run: |
          shopt -s nullglob
          files=(vault-inbox/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "No locked logins on this branch."; exit 0; fi
          if [ -z "$FLG_ADMIN_TOKEN" ]; then echo "::error::Save the FLG_ADMIN_TOKEN secret so the drop box can be reached."; exit 1; fi
          node scripts/vault-drop.mjs post "${files[@]}"
      - name: Delete the branch
        if: success()
        run: git push origin --delete "${GITHUB_REF#refs/heads/}"
