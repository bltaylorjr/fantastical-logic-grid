name: Probe admin passkeys (temporary)
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://flg-api.btay74.workers.dev
          page=$(curl -s $A/admin/)
          for m in 'href="#visitors"' 'data-view="details"' 'href="#media"' 'href="#licenses"' 'href="#signin"' 'Number Place' 'Approve'; do echo "$m: $(grep -c "$m" <<<"$page")"; done
          for f in licenses.js media.js passkeys.js; do echo "$f: $(curl -s -o /dev/null -w '%{http_code}' $A/admin/$f)"; done
          curl -s $A/v1/health | head -c 400; echo
          curl -sI $A/admin/ | grep -i -E "date|last-modified|etag|cf-" || true
