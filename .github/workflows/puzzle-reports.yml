# The puzzle doctor (server/PUZZLE-REPORTS.md): every 15 minutes, checks the
# puzzles players reported with Report a problem, using the game's own engine,
# rebuilds the broken ones and tells the Worker, which emails the players who
# asked (through the Thank-you emails Action). The engine needs no packages.
# The repository is public, so this job prints only counts.
name: Puzzle doctor
on:
  schedule:
    - cron: '9,24,39,54 * * * *'   # GitHub may start it a few minutes late
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: puzzle-reports
jobs:
  examine:
    runs-on: ${{ fromJSON(vars.FLG_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check and repair reported puzzles
        env:
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL || 'https://flg-api.btay74.workers.dev' }}
          FLG_ADMIN_TOKEN: ${{ secrets.FLG_ADMIN_TOKEN }}
        run: node scripts/puzzle-reports.mjs
