# "How to play logic puzzles": three short vertical videos for Facebook and
# Instagram Reels, YouTube Shorts and TikTok (media/promo/README.md). Films the
# real game, voices the script with the game's narrator (Kokoro, free and
# local) and opens a pull request that adds the videos, captions and
# thumbnails to media/promo/. Once merged, the Marketing autopilot posts them
# on the days set in the "how-to-play-tips" campaign.
# Free: GitHub's hosted runners (free for public repositories).
name: How-to-play tip videos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'media/promo/tools/**'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: tip-videos
  cancel-in-progress: true
jobs:
  videos:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[tips]') }}
    runs-on: ${{ fromJSON(vars.FLG_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: video/requirements.txt
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          npm --prefix server ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          pip install -r video/requirements.txt scipy pillow
      - uses: actions/cache@v4
        with:
          path: media/promo/.kokoro
          key: kokoro-v1.0
      - run: npm run build
      - name: Film the game
        run: node media/promo/tools/capture.cjs
      - name: Edit, voice and caption the three tips
        run: python media/promo/tools/build.py tips
      - name: Add them to media/promo
        run: |
          cd media/promo/out
          for f in how-to-play-*-9x16.mp4 how-to-play-*-9x16-captioned.mp4 how-to-play-*-9x16.srt how-to-play-*-9x16-thumbnail.png; do
            [ -f "$f" ] && cp "$f" ../
          done
          ls -la ../how-to-play-*
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: video/how-to-play-tips
          delete-branch: true
          add-paths: |
            media/promo/how-to-play-*
          commit-message: 'How-to-play tip videos [tips]'
          title: 'How-to-play tip videos [tips]'
          body: |
            Three short vertical "How to play logic puzzles" videos (the grid, reading clues, hints), filmed from the current game and narrated by the game's own voice, with captions and thumbnails.

            Merge before the first posting day in the how-to-play-tips campaign (admin > Marketing) so the Marketing autopilot can post them.

            Made by `.github/workflows/tip-videos.yml`.
