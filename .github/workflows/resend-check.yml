# Checks the Resend setup for noreply@thelogicgrid.com: looks up the public DNS
# records Resend needs (they live at Namecheap; the domain stays off
# Cloudflare), then sends one test email to the game's own Gmail through
# Resend. Run it by hand after adding the records and the RESEND_API_KEY
# secret (server/FEEDBACK-EMAILS.md). Prints only record values and Resend's
# answer, never the key or the address.
# Free: a manual GitHub Actions run on a public repo and one Resend email.
name: Resend check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/resend-check.py
          sparse-checkout-cone-mode: false
      - name: Look up the DNS records and send a test email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: python3 -I scripts/resend-check.py
