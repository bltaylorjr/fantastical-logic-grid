# Marketing autopilot: every morning at about 10 am Eastern, the approved ads
# whose posting day has come are posted to the sites whose free official API
# allows it (Bluesky, Mastodon, X, the game's Facebook Page, Instagram,
# Threads, LinkedIn, Pinterest, YouTube, TikTok and Reddit), and the owner's
# inbox gets the rest to post by hand, with the words and link ready
# (scripts/marketing-post.py).
# Each site's key is a GitHub secret (admin > Connections and setup >
# Marketing); a site without its key is emailed instead. Switch either part
# off in admin > Settings and switches > Marketing.
# By hand: Run workflow with mode "check" to test the keys, or "dry-run" to
# see what a day would post (and get the email marked Preview).
# The repository is public: the log shows ad titles and counts, never keys.
# Free: scheduled GitHub Actions on a public repo, the sites' free APIs and Gmail.
name: Marketing autopilot
on:
  schedule:
    - cron: '7 15 * * *'   # 15:07 UTC = 10:07 am Eastern (11:07 in summer time)
  workflow_dispatch:
    inputs:
      mode:
        description: post, check (test the keys), dry-run (post nothing) or message (post the words below to the Facebook Page)
        required: false
        default: post
      day:
        description: Optional day to act as (YYYY-MM-DD), for a dry run
        required: false
      ads:
        description: Optional ad numbers (comma separated) to post now; the admin app's Post now and Launch campaign buttons fill this in
        required: false
      message:
        description: For mode message only, the words to post on the Facebook Page now
        required: false
      image:
        description: For mode message only, an optional https link to a picture to post with it
        required: false
permissions:
  contents: read
concurrency:
  group: marketing-post
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/marketing-post.py
          sparse-checkout-cone-mode: false
      - name: Post today's approved ads
        env:
          MODE: ${{ inputs.mode }}
          DAY: ${{ inputs.day }}
          ONLY_ADS: ${{ inputs.ads }}
          MESSAGE: ${{ inputs.message }}
          IMAGE_URL: ${{ inputs.image }}
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL || 'https://flg-api.btay74.workers.dev' }}
          FLG_ADMIN_TOKEN: ${{ secrets.FLG_ADMIN_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_TASKS_TO: ${{ secrets.OWNER_TASKS_TO }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ vars.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}
        run: python3 -I scripts/marketing-post.py
