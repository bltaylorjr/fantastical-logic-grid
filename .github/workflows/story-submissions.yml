# Checks story submissions (authors/submissions/*.md) on every pull request
# that adds or changes one, using the same rules as the engine's tests, and
# shows the author a plain-English list of anything to fix.
# Runs with a read-only token on pull_request (never pull_request_target), so a
# submission from anyone can't reach secrets.
name: Story submission check
on:
  pull_request:
    paths:
      - 'authors/submissions/**'
      - 'scripts/check-story-submission.mjs'
permissions:
  contents: read
concurrency:
  group: story-submissions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the submitted stories
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'authors/submissions/*.md' | grep -v '/TEMPLATE.md$' || true)
          if [ -z "$files" ]; then echo "No story submissions changed."; exit 0; fi
          node scripts/check-story-submission.mjs $files
