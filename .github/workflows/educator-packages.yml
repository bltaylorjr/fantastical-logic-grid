# Educator puzzle packages (server/EDUCATORS.md): every 5 minutes, and straight
# away when the Worker starts it (optional GITHUB_DISPATCH_TOKEN Worker secret),
# this sends the code emails for new requests from the website's Educators page
# and decline emails, then builds each package the team approved in the admin
# dashboard as PDFs with the game's own puzzle engine and emails them to the
# educator's verified school address. Email goes from noreply@thelogicgrid.com
# through Resend (secret RESEND_API_KEY) or the game's Gmail as the backup
# (the same secrets as the thank-you emails).
# The repository is public, so this job prints only counts and request numbers.
# Free: GitHub Actions on a public repo, Resend's free plan and Gmail cost nothing.
name: Educator packages
on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub may start it a few minutes late
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: educator-packages
jobs:
  send:
    runs-on: ${{ fromJSON(vars.FLG_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL || 'https://flg-api.btay74.workers.dev' }}
      FLG_ADMIN_TOKEN: ${{ secrets.FLG_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Most runs find nothing to do. Only when a package is waiting does the
      # script install the fonts and the PDF printer (Playwright's Chromium).
      - name: Send emails and build packages
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          FLG_SITE_URL: ${{ vars.FLG_SITE_URL }}
        run: python3 -I scripts/educator-packages.py
