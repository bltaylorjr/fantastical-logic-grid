# Temporary: runs the same scan without uploading and prints, for each DOM
# text warning, where the text comes from and the steps to the HTML.
name: CodeQL paths
on:
  push:
    branches: [codeql-fixes]
permissions:
  contents: read
jobs:
  paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - web/vendor
              - web/engine
              - dist
              - mobile
              # Tests run in Node with a pretend browser (a fake localStorage
              # shared by every file), which the scanner reads as paths between
              # unrelated files. They never reach players.
              - scripts/test-*.mjs
              - scripts/e2e-*.cjs
              - engine/test
              - server/test
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          output: sarif
      - name: Print where the text comes from
        run: |
          f=$(ls sarif/*.sarif | head -1)
          jq -r '.runs[0].results[] | select(true) |
            "\(.ruleId) SINK \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) <= " +
            ([.codeFlows[0].threadFlows[0].locations[] | "\(.location.physicalLocation.artifactLocation.uri):\(.location.physicalLocation.region.startLine)"] | join(" > "))' "$f" > paths.txt || true
          wc -l paths.txt
          i=0
          while IFS= read -r line; do i=$((i+1)); echo "::notice title=Path $i::${line:0:900}"; done < <(sort -u paths.txt | head -40)
