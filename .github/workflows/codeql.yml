# CodeQL code scanning (free for public repositories): looks for security
# bugs such as injection, unsafe HTML and leaked secrets in the game, the
# Worker, the admin dashboard and these workflows, on every pull request and
# once a week. Findings appear under Security > Code scanning.
name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 3'   # Wednesdays
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - web/vendor
              - web/engine
              - dist
              - mobile
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
