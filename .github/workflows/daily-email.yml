# Daily puzzle by email: once a day, at about 7 am Eastern, today's puzzle is
# sent to the signed-in players who asked for it, from support@thelogicgrid.com
# through Resend's free plan (secret RESEND_API_KEY), with the game's Gmail as
# the backup (same secrets as the thank-you emails, server/FEEDBACK-EMAILS.md).
# A second run two hours later sends anything the first could not.
# Without the secrets each run just says "not set up" (server/DAILY-EMAIL.md).
# Switch it off in the admin dashboard (Play).
# The repository is public, so this job prints only counts, never addresses.
# Free: scheduled GitHub Actions on a public repo, Resend's free plan and
# Gmail cost nothing.
name: Daily puzzle email
on:
  schedule:
    - cron: '7 11,13 * * *'   # 11:07 and 13:07 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-email
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/daily-email.py
          sparse-checkout-cone-mode: false
      - name: Send today's puzzle to the players who asked for it
        env:
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL || 'https://flg-api.btay74.workers.dev' }}
          FLG_ADMIN_TOKEN: ${{ secrets.FLG_ADMIN_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
        run: python3 -I scripts/daily-email.py
