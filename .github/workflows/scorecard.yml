# OpenSSF Scorecard (free): a weekly check of this repository's security
# habits (pinned actions, branch protection, token permissions, code review,
# signed releases and more). Results appear under Security > Code scanning and
# on the public Scorecard site.
name: Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '43 5 * * 2'   # Tuesdays
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
