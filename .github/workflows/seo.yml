# Keeps the website easy for search engines to find and rank.
# Every pull request: builds the site and runs Lighthouse on the game page and
# the search pages (lighthouserc.json). SEO (95+), accessibility (90+), layout
# shift and the script-size budget must pass or the check fails; the speed
# score, largest paint and blocking time are reported as warnings.
# The live site is checked every night by the nightly maintenance run
# (nightly.yml), which replaced the Monday check here.
# Free: GitHub Actions on a public repo and Lighthouse cost nothing. See SEO.md.
name: Search check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lighthouse:
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.FLG_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse (SEO, accessibility, speed)
        run: npx --yes @lhci/cli@0.15.1 autorun
      # Each failed check as an annotation on the run, readable without the log.
      - name: Show failed Lighthouse checks
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            const f = ".lighthouseci/assertion-results.json";
            if (!fs.existsSync(f)) { console.log("::error::Lighthouse did not finish (no assertion results)"); process.exit(0); }
            for (const a of JSON.parse(fs.readFileSync(f, "utf8"))) if (a.level === "error")
              console.log(`::error::${a.url} ${a.auditProperty || a.auditId}: ${a.actual} (needs ${a.operator} ${a.expected})`);
            for (const r of fs.readdirSync(".lighthouseci").filter((n) => /^lhr-.*\.json$/.test(n))) {
              const lhr = JSON.parse(fs.readFileSync(".lighthouseci/" + r, "utf8"));
              for (const cat of ["seo", "accessibility"]) for (const ref of lhr.categories[cat].auditRefs) {
                const au = lhr.audits[ref.id];
                if (ref.weight > 0 && au.score !== null && au.score < 1) console.log(`::warning::${lhr.finalDisplayedUrl} ${cat}/${ref.id}: ${au.title}`);
              }
            }'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore

