# Puzzle emails (server/PUZZLE-EMAILS.md): every 15 minutes, the confirm
# links people asked for in Menu > Puzzle emails, and on their days the puzzle
# of the week (Mondays from about 7 am Eastern) and the special editions
# planned in the admin dashboard. Sent from noreply@thelogicgrid.com through
# Resend's free plan (secret RESEND_API_KEY), with the game's Gmail as the
# backup (same secrets as the daily and thank-you emails).
# Without the secrets each run just says "not set up".
# Switch it off in the admin dashboard (Settings > Puzzle emails).
# The repository is public, so this job prints only counts, never addresses.
# Free: scheduled GitHub Actions on a public repo, Resend's free plan and
# Gmail cost nothing.
name: Puzzle emails
on:
  schedule:
    - cron: '4,19,34,49 * * * *'   # every 15 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: puzzle-mail
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/puzzle-mail.py
          sparse-checkout-cone-mode: false
      - name: Send what is due (confirm links, the puzzle of the week, special editions)
        env:
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL || 'https://flg-api.btay74.workers.dev' }}
          FLG_ADMIN_TOKEN: ${{ secrets.FLG_ADMIN_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: python3 -I scripts/puzzle-mail.py
