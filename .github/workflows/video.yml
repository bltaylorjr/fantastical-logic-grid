# Keeps the how-to-play video in step with the game. After a change to the game
# lands on main, this re-records the video from the real app, re-voices it with
# the game's narrator (Kokoro, free and local) and opens a pull request that
# updates web/media/intro.mp4, the captions and the transcript, plus the
# Educators page's how-to video (seo/media/educators.*).
# Free: runs on GitHub's hosted runners (free for public repositories).
# One-time setup: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".
name: Update how-to-play video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'engine/**'
      - 'server/src/**'
      - 'video/**'
      - 'seo/educators.js'
      - 'scripts/educators-page.mjs'
      - 'admin/educators.js'
      - '!web/media/**'
      - '!video/README.md'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: video
  cancel-in-progress: true
jobs:
  video:
    # The video's own pull request also touches web/, so skip it when it merges.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[video]') }}
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.FLG_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: video/requirements.txt
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          npm --prefix server ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          pip install -r video/requirements.txt
      - uses: actions/cache@v4
        with:
          path: video/.kokoro
          key: kokoro-v1.0
      - run: npm run build
      - name: Record the game
        run: node video/capture.cjs
      - name: Voice, captions and video
        run: python video/build.py --install
      - name: Educators how-to video (record, voice, install)
        run: |
          node video/educators.cjs
          VIDEO=educators python video/build.py --install
      - name: Puzzle Wizard how-to videos and The Logic Grid intro (record, voice, install)
        run: |
          node video/wizard.cjs
          VIDEO=wizard-fantastical python video/build.py --install
          VIDEO=wizard-ninetimesnine python video/build.py --install
          VIDEO=tlg python video/build.py --install
      - uses: actions/upload-artifact@v7
        with:
          name: how-to-play-video
          path: |
            video/out/intro-captioned.mp4
            video/out/captions.srt
            video/out/transcript.txt
          retention-days: 30
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: video/auto-update
          delete-branch: true
          add-paths: |
            web/media/intro.mp4
            web/media/intro.en.vtt
            web/index.html
            seo/media/educators.mp4
            seo/media/educators.en.vtt
            seo/media/educators-poster.jpg
            seo/media/educators.json
            web/media/wizard
            web/media/games/the-logic-grid.mp4
            web/media/games/the-logic-grid.vtt
            web/media/games/the-logic-grid.jpg
          commit-message: 'Update the how-to-play video [video]'
          title: 'Update the how-to-play video [video]'
          body: |
            Re-recorded the how-to-play video, the Educators video, the Puzzle Wizard how-to videos (one for each game) and The Logic Grid intro from the current site (commit ${{ github.sha }}), narrated by the game's own Kokoro voice, with retimed captions and transcripts.

            A copy with burned-in captions and an SRT file for video sites are in this run's artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Made by `.github/workflows/video.yml`. Merge it to ship the new video with the next release.
