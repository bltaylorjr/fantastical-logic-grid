# The iPhone and iPad app (mobile/ios). Resumed by Bobby 2026-11-08.
#
# check:    on every change to the iOS app, compiles it for the Simulator. Needs no
#           Apple account. GitHub's Mac machines are free for this public repository.
# app-store: signs the app and uploads it to App Store Connect (TestFlight first,
#           then Bobby sends it for review). Runs after each "Release desktop app"
#           and when started by hand. It is skipped quietly until these are set:
#             secrets APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#                     APP_STORE_CONNECT_KEY_BASE64 (the .p8 file, base64)
#             variable APPLE_TEAM_ID
#           Steps for the owner: docs/APP-STORE.md.
name: iPhone and iPad app
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to App Store Connect (needs the Apple secrets)
        type: boolean
        default: true
  pull_request:
    paths: ['mobile/ios/**', 'mobile/shared/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['mobile/ios/**', 'mobile/shared/**', '.github/workflows/ios.yml']
  workflow_run:
    workflows: ['Release desktop app']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.upload)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Newest Xcode on the machine
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - run: brew install xcodegen
      - name: Privacy manifest and Info.plist are valid
        working-directory: mobile/ios
        run: plutil -lint LogicGrid/Info.plist LogicGrid/PrivacyInfo.xcprivacy ExportOptions.plist
      - name: Build for the iOS Simulator (no Apple account needed)
        working-directory: mobile/ios
        run: |
          xcodegen
          V=$(node -p "require('../../desktop/src-tauri/tauri.conf.json').version")
          xcodebuild -project LogicGrid.xcodeproj -scheme LogicGrid -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$V" build
          APP=build/Build/Products/Release-iphonesimulator/LogicGrid.app
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::Privacy manifest missing from the app"; exit 1; }
          test -f "$APP/web/index.html" || { echo "::error::Game files missing from the app"; exit 1; }
          test -f "$APP/native-bridge.js" || { echo "::error::native-bridge.js missing from the app"; exit 1; }
          cd build/Build/Products/Release-iphonesimulator && zip -qr "$RUNNER_TEMP/LogicGrid-simulator.zip" LogicGrid.app
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/LogicGrid-simulator.zip

  app-store:
    if: (github.event_name == 'workflow_dispatch' && inputs.upload) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: macos-latest
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Apple secrets set?
        id: ready
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_B64" ] && [ -n "$TEAM_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Apple secrets are not set yet (docs/APP-STORE.md), so nothing was uploaded."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      # Built with the game server, so accounts, voices and races work in the app.
      - if: steps.ready.outputs.ok == 'true'
        name: Build the game for the app
        run: npm run build
        env:
          FLG_FIREBASE_API_KEY: ${{ vars.FLG_FIREBASE_API_KEY }}
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL }}
          FLG_SITE_REPO: ${{ vars.FLG_SITE_REPO }}
      - if: steps.ready.outputs.ok == 'true'
        name: Newest Xcode on the machine
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - if: steps.ready.outputs.ok == 'true'
        run: brew install xcodegen
      - if: steps.ready.outputs.ok == 'true'
        name: Archive, sign and upload
        working-directory: mobile/ios
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          echo "$KEY_B64" | base64 -d > "$KEY"
          xcodegen
          V=$(node -p "require('../../desktop/src-tauri/tauri.conf.json').version")
          # Every upload needs a bigger build number; this workflow's run number always grows.
          B=${{ github.run_number }}
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project LogicGrid.xcodeproj -scheme LogicGrid -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LogicGrid.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$B" \
            "${AUTH[@]}" archive
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LogicGrid.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "Uploaded version $V (build $B). It shows in App Store Connect > TestFlight in about 15 minutes." >> "$GITHUB_STEP_SUMMARY"
          rm -f "$KEY"
