# Account warnings: once a day, accounts about to be deleted get an email
# first (server/src/inactive-accounts.js): a week before an inactive account
# is deleted, and 3 days before an account with no screen name is deleted.
# Sent from noreply@thelogicgrid.com through Resend (secret RESEND_API_KEY),
# with the game's Gmail as the backup (same secrets as the daily puzzle email,
# server/DAILY-EMAIL.md). Nothing is sent while "Delete inactive accounts
# automatically" is off in the admin dashboard (Settings, Inactive accounts).
# The repository is public, so this job prints only counts, never addresses.
name: Account warnings
on:
  schedule:
    - cron: '37 15 * * *'   # 15:37 UTC, mid-morning in the US
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inactive-warning
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: runner.environment == 'self-hosted'
        name: Start from an empty folder (our build server keeps the last job's files)
        run: sudo find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/inactive-warning.py
          sparse-checkout-cone-mode: false
      - name: Email the accounts that are about to be deleted
        env:
          FLG_CLOUD_URL: ${{ vars.FLG_CLOUD_URL || 'https://flg-api.btay74.workers.dev' }}
          FLG_ADMIN_TOKEN: ${{ secrets.FLG_ADMIN_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_NOREPLY: ${{ vars.MAIL_NOREPLY }}
        run: python3 -I scripts/inactive-warning.py
